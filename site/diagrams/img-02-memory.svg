<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="330" rx="20" fill="#0F172A"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#F1F5F9">🧮 What fits in your 64 GB at the same time</text>
  <!-- scale: 64 GB = 1000 px, x0 = 50 → 15.625 px/GB -->
  <text x="40" y="100" font-size="16" fill="#86EFAC">✅ Recommended set</text>
  <rect x="50" y="112" width="1000" height="56" rx="10" fill="#1E293B"/>
  <rect x="50" y="112" width="90" height="56" rx="10" fill="#7C3AED"/><text x="95" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🧠 5.8</text>
  <rect x="140" y="112" width="188" height="56" fill="#EA580C"/><text x="234" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🎨 ~12 (est.)</text>
  <rect x="328" y="112" width="33" height="56" fill="#0891B2"/><text x="345" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🔊</text>
  <text x="380" y="146" font-size="15" fill="#94A3B8">≈ 20 GB used · ~44 GB left for macOS + apps 👍</text>
  <text x="40" y="215" font-size="16" fill="#FCA5A5">⛔ Avoid loading together</text>
  <rect x="50" y="227" width="1000" height="56" rx="10" fill="#1E293B"/>
  <rect x="50" y="227" width="664" height="56" rx="10" fill="#B91C1C"/><text x="382" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🧠 llama-3.3-70b · 42.5 GB</text>
  <rect x="714" y="227" width="188" height="56" fill="#EA580C"/><text x="808" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🎨 ~12</text>
  <rect x="902" y="227" width="33" height="56" fill="#0891B2"/><text x="918" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🔊</text>
  <text x="945" y="261" font-size="14" fill="#FCA5A5">swap 🐌</text>
  <g font-size="13" fill="#64748B" text-anchor="middle"><text x="50" y="310">0</text><text x="300" y="310">16 GB</text><text x="550" y="310">32 GB</text><text x="800" y="310">48 GB</text><text x="1050" y="310">64 GB</text></g>
</svg>
